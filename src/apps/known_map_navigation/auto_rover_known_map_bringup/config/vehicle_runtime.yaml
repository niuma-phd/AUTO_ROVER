# ROS XML-RPC-compatible subset of vehicle_profile.yaml. It contains only values
# required by phase-1 algorithms; unknown canonical values remain null in the
# full profile and are not uploaded as fabricated zeros.
vehicle_profile:
  schema_version: 1
  profile_id: nuc_senior_akm_v1
  kinematic_model: ackermann_bicycle
  direction_capability: signed_speed_direction
  reference_frame: rear_axle_center
  wheelbase_m: 0.3187
  max_forward_speed_mps: 0.50
  max_longitudinal_accel_mps2: 0.20
  min_turning_radius_m: 0.95
  reverse_supported: false
